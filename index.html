<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Generator</title>

    <link rel="stylesheet" href="css/main.css" />
    <script
      src="https://kit.fontawesome.com/cda6091d90.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="main-layout" onload="onInit()">
    <header class="main-header main-layout full">
      <div class="header-container flex align-center space-between">
        <h1 class="main-logo">Meme Generator</h1>
        <nav class="main-nav flex">
          <ul class="clean-list flex">
            <li><a href="#" onclick="onNavClick('gallery')">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#" onclick="onNavClick('savedMemes')">Memes</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="gallery-actions">
      <button class="flexible" onclick="onRandomMeme()">I'm Flexible</button>
      <div class="filter-container">
        <input
          list="keywords"
          class="filter-input"
          placeholder="Search"
          oninput="onFilter()"
        />
        <datalist id="keywords">
          <option value="funny"></option>
          <option value="cat"></option>
          <option value="baby"></option>
        </datalist>
        <button onclick="onClearFilter()">Clear Filter</button>
      </div>
    </section>
    <section class="gallery-container"></section>
    <section class="editor-container hidden">
      <div class="canvas-container">
        <canvas width="400px" height="400px"></canvas>
      </div>
      <div class="actions flex align-center">
        <input
          class="user-text"
          type="text"
          oninput="onSetLineTxt(this.value)"
        />
        <div class="text-section">
          <button class="add-line action-item" onclick="onAddLine()">
            <i class="fa-regular fa-keyboard"></i>
          </button>

          <button class="switch-lines action-item" onclick="onSwitchLines()">
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>
        <div class="font-size-container">
          <button class="increase action-item" onclick="onChangeValue(+1)">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button class="decrease action-item" onclick="onChangeValue(-1)">
            <i class="fa-solid fa-minus"></i>
          </button>
        </div>
        <div class="align-content">
          <button onclick="onSetAlign('left')">
            <i class="fa-solid fa-align-left"></i>
          </button>
          <button onclick="onSetAlign('center')">
            <i class="fa-solid fa-align-center"></i>
          </button>
          <button onclick="onSetAlign('right')">
            <i class="fa-solid fa-align-right"></i>
          </button>
        </div>
        <div class="move-content">
          <button onclick="onMoveLine(-10)">
            <i class="fa-solid fa-arrow-up"></i>
          </button>

          <button onclick="onMoveLine(10)">
            <i class="fa-solid fa-arrow-down"></i>
          </button>
        </div>
        
        <button onclick="onDeleteLine()">
          <i class="fa-solid fa-trash"></i>
        </button>
        <input
          type="color"
          class="color action-item"
          value="#FFFFFF"
          oninput="onSetColor(this.value)"
        />
        <div class="social">
        <button>
          <a
          href="#"
          class="download"
          onclick="onDownloadImg(this)"
          download="file-name"
          >Download</a
          >
        </button>
        <button class="save" onclick="onSaveMeme()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
        <form method="POST" enctype="multipart/form-data" onsubmit="onUploadImg(event)">
      <input name="img" id="imgData" type="hidden" />
      <button class="btn" type="submit">Upload to Cloud</button>
    </form>
    <div class="share-container flex align-center"></div>
      </div>
        </div>

    </section>
    <section class="saved-memes-container hidden">aaaa</section>

    <script src="js/util-service.js"></script>
    <script src="js/stroage-service.js"></script>
    <script src="js/meme-controller.js"></script>
    <script src="js/meme-service.js"></script>
    <script src="js/storage-controller.js"></script>
    <script src="js/gallery-controller.js"></script>
  </body>
</html>
