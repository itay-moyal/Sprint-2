<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Generator</title>

    <link rel="stylesheet" href="css/main.css" />
    <script
      src="https://kit.fontawesome.com/cda6091d90.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="main-layout" onload="onInit()">
    <header class="main-header full main-layout">
      <div class="header-container flex space-between align-center">
        <h1 class="main-logo">Meme Generator</h1>
      </div>
      <nav class="main-nav">
        <ul class="clean-list flex">
          <li><a href="/">Home</a></li>
          <li><a href="/">About</a></li>
          <li><a href="/">Memes</a></li>
        </ul>
      </nav>
    </header>
    <section class="gallery-container"></section>
    <section class="editor-container hidden">
      <div class="canvas-container">
        <canvas width="400px" height="400px"></canvas>
      </div>
      <div class="actions">
        <input
          class="user-text"
          type="text"
          oninput="onSetLineTxt(this.value)"
        />
        <a href="#" onclick="onDownloadImg(this)" download="file-name"
          >Download</a
        >
        <div class="font-size-container">
          <button class="increase" onclick="changeValue(+1)">
            <i class="fa-solid fa-plus"></i>
          </button>
          <button class="decrease" onclick="changeValue(-1)">
            <i class="fa-solid fa-minus"></i>
          </button>
        </div>
        <input type="color" value="#FFFFFF" oninput="onSetColor(this.value)" />
        <button class="add-line" onclick="onAddLine()">
          <i class="fa-regular fa-keyboard"></i>
        </button>

        <button class="switch-lines" onclick="onSwitchLines()"><i class="fa-solid fa-repeat"></i></button>
      </div>
    </section>
    <script src="js/util-service.js"></script>
    <script src="js/pic-service.js"></script>
    <script src="js/meme-controller.js"></script>
    <script src="js/meme-service.js"></script>
    <script src="js/gallery-controller.js"></script>
  </body>
</html>
